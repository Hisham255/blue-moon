<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blue Moon</title>


  <!-- * google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Black+Ops+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital@0;1&display=swap"
    rel="stylesheet">

  <!-- * Tailwind -->
  <script src="js/browser@4.js"></script>

  <!-- * AOS  -->
  <link rel="stylesheet" href="css/aos.css">

  <!-- * css file -->
  <link rel="stylesheet" href="css/style.css">



</head>




<body class="bg-[var(--secondary-a)]">

  <!-- ! navbar index section start -->

  <nav class="bg-[var(--secondary-a)]  h-[60px] sm:h-[80px] w-full z-50 fixed">

    <!-- * main nab body -->
    <section class="border-b-[0.5px] border-[var(--secondary-d)] mx-auto max-w-7xl px-3 h-full grid grid-cols-5 lg:grid-cols-13">

      <!-- * web icon -->
      <div class="col-span-2 lg:col-span-3 flex justify-start select-none items-center">
        <a href="index.html">
          <h2 class="font-boo  xl:text-4xl sm:text-3xl text-xl text-white">BLUE MOON</h2>
        </a>
      </div>

      <!-- * links list over large -->
      <div class="hidden lg:block lg:col-span-6 select-none">
        <ul class="h-full w-full  text-white/70 list-none flex justify-center items-center">
          <li class="2xl:mx-5 mx-4 text-base hover:text-white/100 "><a href="#">Home</a></li>
          <li class="2xl:mx-5 mx-4 text-base hover:text-white/100 "><a href="#">Category</a></li>
          <li class="2xl:mx-5 mx-4 text-base hover:text-white/100 "><a href="#">News</a></li>
        </ul>
      </div>

      <!-- * search form and button for links menu  under large -->
      <div class="col-span-3 lg:col-span-4 flex justify-end items-center ">

        <!-- * search form -->
        <form action="#" id="nabarForm"
          class="bg-[var(--secondary-c)] h-[55%] w-[80%] rounded-full px-4 flex items-center">
          <button type="submit" class="text-white/30 font-semibold m-0 pt-1 cursor-pointer">
            <iconify-icon icon="akar-icons:search" class="sm:text-xl text-base"></iconify-icon>
          </button>

          <input id="searchValue" type="text" name="search_value" placeholder="Search movies, series, actors...."
            class="text-white/70 ml-2 w-[90%] outline-none border-none sm:text-sm text-xs overflow-hidden shadow-none placeholder:select-none">

        </form>

        <!-- * links menu button-->
        <span class="block lg:hidden mx-4 w-fit h-fit ">
          <button id="menuBtn"
            class="border border-white/70 rounded-sm p-1 flex justify-center items-center aspect-square cursor-pointer">
            <iconify-icon id="menuBtnIcon" icon="eva:menu-outline"
              class="sm:text-2xl text-base  text-white/60 "></iconify-icon>
          </button>
        </span>


      </div>


    </section>

    <!-- * drop list for under large screen -->
    <section id="navMenu" class="block lg:hidden  bg-[var(--secondary-a)] w-full ">
      <ul
        class="pt-5 pb-2 list-none w-[90%] mx-auto border-b border-[var(--secondary-d)]  flex flex-col items-start select-none">
        <li class="text-base mb-3 text-white/70 hover:text-white/100 font-bold tracking-widest"><a href="#">Home</a>
        </li>
        <li class="text-base mb-3 text-white/70 hover:text-white/100 font-bold tracking-widest"><a href="#">Category</a>
        </li>
        <li class="text-base mb-3 text-white/70 hover:text-white/100 font-bold tracking-widest"><a href="#">News</a>
        </li>

      </ul>
    </section>

  </nav>

  <!-- ? navbar index section end -->



  <!-- ! header index section start -->

  <header class="pt-20">

    <!-- * hero section index -->
    <section class="p-2">
      <article class="pt-5">
        



      </article>
    </section>



  </header>

  <!-- ? header index section end -->





  <!-- * Iconify -->
  <script src="js/iconify-icon.min.js"></script>

  <!-- * AOS js file -->
  <script src="js/aos.js"></script>

  <!-- * main js file -->
  <script src="js/main.js"></script>



</body>

</html>
